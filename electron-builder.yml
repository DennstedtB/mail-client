appId: io.github.dennstedtb.mailclient
productName: MailClient
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
mac:
  category: public.app-category.productivity
  target: dmg
  # Ad-hoc signature: enough to run on the Mac that built the app (Apple Silicon
  # refuses unsigned code). A Developer ID certificate, hardened runtime and
  # notarization come later, when the app is shared with other Macs.
  identity: '-'
  hardenedRuntime: false
