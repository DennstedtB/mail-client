name: CI

on:
  pull_request:
  push:
    branches: [main]

# The checks only read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The checks and the build don't start Electron, so skip the binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Install scripts of dependencies must not be able to read the job token.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx electron-vite build
